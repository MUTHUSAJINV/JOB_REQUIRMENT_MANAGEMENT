{% extends "base.html" %}

{% block title %}Create Account | CareerPulse{% endblock %}

{% block content %}
<div class="container" style="max-width: 580px; padding-top: 3rem; padding-bottom: 5rem;">
  <div class="card" style="padding: 2.2rem; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="logo-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      </div>
      <h1 class="page-title" style="font-size: 1.7rem;">Create Your Account</h1>
      <p class="page-subtitle">Join thousands of professionals and hiring managers</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST" id="register-form">
      <!-- Role Toggle -->
      <div class="form-group">
        <label class="form-label">I want to join as:</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem;">
          <label style="display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); background: var(--bg-surface); cursor: pointer;">
            <input type="radio" name="role" value="seeker" checked style="accent-color: var(--primary);">
            <div>
              <div style="font-weight: 600; font-size: 0.95rem; color: var(--text-main);">Job Seeker</div>
              <div style="font-size: 0.78rem; color: var(--text-muted);">Looking for opportunities</div>
            </div>
          </label>

          <label style="display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); background: var(--bg-surface); cursor: pointer;">
            <input type="radio" name="role" value="recruiter" style="accent-color: var(--primary);">
            <div>
              <div style="font-weight: 600; font-size: 0.95rem; color: var(--text-main);">Recruiter</div>
              <div style="font-size: 0.78rem; color: var(--text-muted);">Hiring talent</div>
            </div>
          </label>

          <label style="display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); background: var(--bg-surface); cursor: pointer;">
            <input type="radio" name="role" value="admin" style="accent-color: var(--primary);">
            <div>
              <div style="font-weight: 600; font-size: 0.95rem; color: var(--text-main);">Admin</div>
              <div style="font-size: 0.78rem; color: var(--text-muted);">System config</div>
            </div>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="jane@example.com" required>
      </div>

      <!-- Recruiter-specific Company Name Field -->
      <div class="form-group" id="companyFieldGroup" style="display: none;">
        <label class="form-label" for="company_name">Company / Organization Name</label>
        <input type="text" id="company_name" name="company_name" class="form-control" placeholder="e.g. Acme Technologies Inc.">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" id="register-submit-btn" style="width: 100%; padding: 0.8rem; margin-top: 0.75rem;">
        Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? 
      <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
