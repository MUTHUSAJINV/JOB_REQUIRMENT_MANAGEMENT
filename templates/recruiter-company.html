{% extends "base.html" %}

{% block title %}Company Profile | CareerPulse{% endblock %}

{% block content %}
<div class="container" style="max-width: 820px;">
  <div class="page-header">
    <div>
      <h1 class="page-title">Company Profile & Employer Brand</h1>
      <p class="page-subtitle">Showcase your organization culture and information to top applicants</p>
    </div>
    <a href="{{ url_for('recruiter_dashboard') }}" class="btn btn-secondary">
      Back to Console
    </a>
  </div>

  <div class="card" style="padding: 2.2rem;">
    <form action="{{ url_for('recruiter_company') }}" method="POST">
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="company_name">Company / Organization Name *</label>
          <input type="text" id="company_name" name="company_name" class="form-control" value="{{ company.company_name if company else '' }}" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="industry">Industry / Domain</label>
          <input type="text" id="industry" name="industry" class="form-control" placeholder="e.g. Enterprise SaaS & Cloud Computing" value="{{ company.industry or '' if company else '' }}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="website">Company Website URL</label>
          <input type="url" id="website" name="website" class="form-control" placeholder="https://example.com" value="{{ company.website or '' if company else '' }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="location">Headquarters / Office Location</label>
          <input type="text" id="location" name="location" class="form-control" placeholder="e.g. San Francisco, CA / Remote" value="{{ company.location or '' if company else '' }}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="description">About the Company / Mission Statement</label>
        <textarea id="description" name="description" class="form-control" style="min-height: 140px;" placeholder="Tell potential hires about your vision, culture, engineering stack, and benefits...">{{ company.description or '' if company else '' }}</textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <a href="{{ url_for('recruiter_dashboard') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary btn-lg" id="save-company-btn">
          Save Company Profile
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
